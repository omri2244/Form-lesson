<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div id="mainform">
        <div id="fullname">
            <label for="Full name">Full name</label>
            <div id="namediv">
                <input type="text" name="fn" class="heigtinput" placeholder="whats your first name" id="thefirstname">
                <input type="text" name="ln" class="heigtinput" placeholder="whats your last name" id="thelastname">
            </div>
        </div>

        <div id="username">
            <label for="username">Username</label>
            <div id="usernamediv">
                <input type="text" name="fn" class="width100 heigtinput">
            </div>
        </div>

        <div id="password">
            <label for="password">Password</label>
            <div id="passwordiv">
                <input type="text" class="width100 heigtinput">
            </div>
        </div>

        <div id="date">
            <label for="date">Birthdate</label>
            <div id="datediv">
                <input type="date" class="width100 heigtinput">
            </div>
        </div>

        <div>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="male"> Male
            <label for="male"></label>
            <input type="radio" name="gender" id="female"> Female
            <label for="female"></label>
            <input type="radio" name="gender" id="RNTS"> Rather not to say
            <label for="RNTS"></label>
        </div>

        <div>
            <input type="checkbox" name="Agree to T&C" value="agree">
            <label for="validation">Agree to T&C</label>
        </div>

        <div id="submit">
            <input type="submit" onclick="myButtonWasClicked()" class="width100 heigtinput" id="submit">
        </div>

    </div>


    <script src="index.js"></script>
</body>

</html>
